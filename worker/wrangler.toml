# radar de eventos: API do formulário "cadastrar evento" (Cloudflare Worker)
# publicar:  cd worker && npx wrangler deploy
# segredos (cada um pede o valor no terminal, nada fica no repo):
#   npx wrangler secret put TURNSTILE_SECRET
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put DISCORD_WEBHOOK   (opcional: avisos de cada envio num canal do Discord)
name = "radar-eventos"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
REPO = "baptixta/personal-portfolio"
BRANCH = "main"
ARQUIVO = "radar/eventos.json"
ORIGENS = "https://baptixta.com,https://www.baptixta.com"

# checagem de conteúdo com IA
[ai]
binding = "AI"

# no máximo 3 envios por minuto por IP
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"
simple = { limit = 3, period = 60 }
