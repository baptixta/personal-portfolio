name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
  # todo dia às 9h (Brasília): traz as edições novas da newsletter do Substack
  schedule:
    - cron: "0 12 * * *"
  # disparado pelo repo baptixta/guia-do-game-designer a cada push na main dele
  repository_dispatch:
    types: [guia-updated]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # conteúdo do guia do game designer (baptixta.com/guia-game-designer/)
      - uses: actions/checkout@v4
        with:
          repository: baptixta/guia-do-game-designer
          path: guia
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # se o Substack falhar, o script só avisa e o site segue com as edições do repositório
      - run: node sync-newsletter.mjs
      - run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
